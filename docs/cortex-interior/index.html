<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Inside the Cerniam Cortex</title>
<style>
:root{
  --navy:#07111d;--navy-2:#0b1724;--graphite:#111c27;--panel:#0a1521;
  --white:#f4f2ea;--warm:#fff7df;--muted:#8e9ba8;--line:#29404f;
  --teal:#35c6c2;--teal-deep:#008b8b;--amber:#d9a441;--danger:#a86b45;
  --display:"Arial Narrow","Aptos Narrow","Helvetica Neue",sans-serif;
  --body:"Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"SFMono-Regular",Consolas,"Liberation Mono",monospace;
}
*{box-sizing:border-box} html,body{margin:0;min-height:100%;background:var(--navy);color:var(--white)}
body{font-family:var(--body);overflow-x:hidden;background:
 radial-gradient(ellipse at 36% 42%,rgba(26,56,67,.24),transparent 42%),
 linear-gradient(145deg,#091521 0%,#07111d 55%,#050c14 100%)}
button{font:inherit} button:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--white);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.app{min-height:100svh;display:grid;grid-template-rows:auto 1fr}
.mast{height:88px;padding:18px 28px 14px;display:grid;grid-template-columns:minmax(260px,1fr) auto auto;gap:24px;align-items:end;border-bottom:1px solid rgba(113,148,164,.18);position:relative;z-index:10;background:linear-gradient(180deg,rgba(7,17,29,.98),rgba(7,17,29,.78))}
.brand{display:flex;align-items:baseline;gap:18px;min-width:0}.brand b{font:700 17px/1 var(--display);letter-spacing:.18em}.brand span{font:10px/1 var(--mono);letter-spacing:.15em;color:var(--muted);text-transform:uppercase}
.views,.controls{display:flex;gap:6px;align-items:center}.ui-btn{min-height:40px;padding:0 13px;border:1px solid var(--line);background:transparent;color:var(--muted);font:700 10px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;transition:background .2s,color .2s,border-color .2s}.ui-btn:hover{color:var(--white);border-color:#557283}.ui-btn[aria-pressed="true"]{color:var(--navy);background:var(--white);border-color:var(--white)}.ui-btn.primary{color:var(--white);border-color:var(--teal-deep)}.ui-btn.primary[aria-pressed="true"]{color:var(--navy)}
.workspace{display:grid;grid-template-columns:minmax(0,1fr) 340px;min-height:0;height:calc(100svh - 88px)}
.stage{position:relative;min-width:0;overflow:hidden}.plate{width:100%;height:100%;display:block}.mobile-topology{display:none}
.inspector{border-left:1px solid rgba(113,148,164,.22);background:rgba(6,15,24,.76);padding:28px 25px 20px;overflow:auto;display:flex;flex-direction:column;min-width:0}
.eyebrow{margin:0;color:var(--teal);font:700 10px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase}.inspector h1{margin:12px 0 8px;font:500 clamp(29px,2.7vw,42px)/.98 var(--display);letter-spacing:-.025em;text-transform:uppercase;text-wrap:balance}.thesis{margin:0 0 24px;color:#b8c2c9;font:15px/1.45 var(--body);max-width:31ch}.active-label{display:flex;align-items:center;gap:10px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin-bottom:18px;font:700 10px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase}.active-label::before{content:"";width:7px;height:7px;background:var(--teal);box-shadow:0 0 12px rgba(53,198,194,.65)}
.readout{margin:0;display:grid}.readout>div{padding:11px 0;border-bottom:1px solid rgba(63,89,102,.45)}.readout dt{font:700 9px/1.2 var(--mono);letter-spacing:.13em;text-transform:uppercase;color:#758896}.readout dd{margin:6px 0 0;font:13px/1.38 var(--body);color:#dce2e3}.readout strong{color:var(--white);font-weight:600}.readout .proof{color:var(--warm);font-family:var(--mono);font-size:11px;overflow-wrap:anywhere}
.milestone{margin-top:auto;padding-top:18px;color:var(--teal);font:700 10px/1.4 var(--mono);letter-spacing:.08em;text-transform:uppercase;min-height:48px}.timeline{height:2px;background:#1c303c;position:relative;margin-top:10px}.timeline i{position:absolute;inset:0 auto 0 0;width:0;background:var(--teal);box-shadow:0 0 10px rgba(53,198,194,.4)}
/* SVG plate */
.plate text{font-family:var(--mono);pointer-events:none}.gridline{stroke:#17303e;stroke-width:1}.hair{fill:none;stroke:#33505e;stroke-width:1}.ghost{fill:none;stroke:#4b6570;stroke-width:1;stroke-dasharray:4 7}.semantic{fill:none;stroke:var(--teal);stroke-width:1.8}.expected{fill:none;stroke:var(--teal);stroke-width:1.2;stroke-dasharray:6 6}.proof-line{fill:none;stroke:var(--warm);stroke-width:1.3}.amber-line{fill:none;stroke:var(--amber);stroke-width:1.4}.route{stroke-dasharray:1000;stroke-dashoffset:1000;transition:stroke-dashoffset .9s cubic-bezier(.23,1,.32,1)}.route.on{stroke-dashoffset:0}.shell{fill:url(#shellGrad);stroke:#486270;stroke-width:1.2}.cut-face{fill:url(#cutGrad);stroke:#314b58;stroke-width:1.2}.membrane{fill:none;stroke:#66808c;stroke-width:1.1}.ring{fill:none;stroke:#1e7477;stroke-width:13;opacity:.28}.ring-live{fill:none;stroke:var(--teal);stroke-width:2;stroke-dasharray:2 7}.hub{fill:#0b1925;stroke:#45606d;stroke-width:1;cursor:pointer;transition:fill .2s,stroke .2s}.hub:hover,.hub:focus{fill:#112a35;stroke:var(--white);outline:none}.hub.active{stroke:var(--teal);fill:#0c252e}.hub-label{font-size:8px;fill:#aab7bd;letter-spacing:.08em}.tiny{font-size:7px;fill:#708793;letter-spacing:.08em}.label{font-size:9px;fill:#dfe5e4;letter-spacing:.12em}.section-label{font-size:9px;fill:var(--teal);letter-spacing:.15em;font-weight:700}.state-label{font-size:8px;fill:#80929b;letter-spacing:.1em}.state-value{font-size:12px;fill:var(--white);font-weight:700;letter-spacing:.04em}.big-e-text{font-size:11px;fill:var(--white);font-weight:700}.node{fill:#0a1722;stroke:#38515d;stroke-width:1}.node.active{fill:var(--warm);stroke:var(--warm);filter:url(#proofGlow)}.node.semantic-active{fill:var(--teal);stroke:var(--teal);filter:url(#tealGlow)}.cluster-link{stroke:#2d4652;stroke-width:1}.cluster-link.active{stroke:var(--teal);opacity:.8}.token{fill:#102733;stroke:var(--teal);stroke-width:1}.token-text{fill:var(--teal);font-size:8px;font-weight:700}.chamber{fill:url(#chamberGrad);stroke:#68808b;stroke-width:1.2;filter:url(#softShadow);cursor:pointer}.chamber:focus{outline:none;stroke:var(--white);stroke-width:2}.model{fill:#0c1b27;stroke:#38515d;stroke-width:1}.state-row{fill:#0a151f;stroke:#2c434f;stroke-width:.8}.state-row.current{stroke:var(--teal);fill:#0d2a31}.gate{fill:#211c15;stroke:var(--amber);stroke-width:1}.candidate{fill:#0a161f;stroke:#38505c;stroke-width:.8}.candidate.reveal{stroke:#78909a}.candidate.selected{fill:#0d302f;stroke:var(--teal);stroke-width:1.4}.candidate.eliminated{opacity:.38}.candidate.eliminated+text{text-decoration:line-through}.vault{fill:#0a151f;stroke:#7d7768;stroke-width:1.2;cursor:pointer}.vault:focus{outline:none;stroke:var(--white);stroke-width:2}.receipt-slot{fill:#101b23;stroke:#4c5554;stroke-width:.8}.receipt-slot.committed{fill:#29271f;stroke:var(--warm)}.ribbon-stage{fill:none;stroke:#e3e6e2;stroke-width:2.4}.ribbon-semantic{fill:none;stroke:var(--teal);stroke-width:2.4}.ribbon-label{font-size:7px;letter-spacing:.12em}.packet{fill:var(--white);filter:url(#whiteGlow);opacity:0}.packet.visible{opacity:1}.packet.proof-packet{fill:var(--warm)}.packet.outcome-packet{fill:var(--teal)}.callout{stroke:#516a76;stroke-width:.8}.click-region{cursor:pointer}.click-region:hover .section-label{fill:var(--white)}
.view-state .shell,.view-state .hub,.view-state .cluster-link,.view-state .ring{opacity:.22}.view-state .chamber,.view-state .model,.view-state .state-row,.view-state .candidate,.view-state .gate{opacity:1}.view-evidence .shell,.view-evidence .hub,.view-evidence .cluster-link,.view-evidence .ring,.view-evidence .chamber{opacity:.18}.view-evidence .vault,.view-evidence .receipt-slot,.view-evidence .proof-line,.view-evidence .ribbon-stage,.view-evidence .ribbon-semantic{opacity:1}
/* mobile */
.mobile-card{border:1px solid #2a424f;background:#0a1621;padding:13px 14px;position:relative;min-width:0;cursor:pointer}.mobile-card::after{content:"↓";position:absolute;left:50%;bottom:-24px;color:var(--teal);font:14px var(--mono)}.mobile-card:last-child::after{display:none}.mobile-card.active{border-color:var(--teal);background:#0c2029}.mobile-card.proof-card{border-color:#77715f}.mobile-card.threshold{border-color:var(--amber)}.mobile-kicker{display:flex;justify-content:space-between;gap:8px;color:var(--teal);font:700 9px/1.2 var(--mono);letter-spacing:.12em;text-transform:uppercase}.mobile-main{display:block;margin-top:7px;font:600 14px/1.25 var(--body);color:var(--white)}.mobile-sub{display:block;margin-top:5px;color:#8fa0a8;font:10px/1.35 var(--mono)}
@media(max-width:1050px){.workspace{grid-template-columns:minmax(0,1fr) 300px}.mast{grid-template-columns:1fr auto}.brand span{display:none}.views{grid-row:2;grid-column:1/-1;justify-content:flex-start}.mast{height:118px;align-items:center}.workspace{height:calc(100svh - 118px)}.inspector{padding:22px 18px}}
@media(max-width:700px){body{background:linear-gradient(180deg,#07111d,#091722 55%,#07111d)}.app{display:block}.mast{height:auto;position:sticky;top:0;padding:13px 14px 12px;display:grid;grid-template-columns:1fr auto;gap:10px;background:rgba(7,17,29,.96);backdrop-filter:blur(10px)}.brand b{font-size:14px}.views{grid-column:1/-1;grid-row:2;overflow-x:auto;scrollbar-width:none}.views .ui-btn{flex:1;min-width:max-content}.controls{grid-column:2;grid-row:1}.controls .ui-btn{padding:0 10px}.workspace{display:block;height:auto}.stage{overflow:visible;padding:20px 14px 28px}.plate{display:none}.mobile-topology{display:grid;gap:24px}.inspector{border:0;border-top:1px solid var(--line);padding:25px 16px 28px;min-height:520px}.inspector h1{font-size:36px;max-width:10ch}.thesis{max-width:34ch}.milestone{margin-top:18px}.ui-btn{min-height:44px;font-size:9px}.active-label{position:sticky;top:120px;background:var(--navy);z-index:2}.mobile-card{min-height:92px}.mobile-card[hidden]{display:none!important}}
@media(max-width:390px){.brand{gap:0}.controls{gap:4px}.controls .ui-btn{padding:0 8px}.mast{padding-inline:12px}.stage{padding-inline:12px}.inspector h1{font-size:33px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}.route{stroke-dashoffset:0}.packet{display:none}.timeline i{width:100%!important}}
</style>
</head>
<body>
<div class="app">
<header class="mast">
  <div class="brand"><b>CERNIAM</b><span>Technical cutaway / Cortex interior</span></div>
  <nav class="views" aria-label="Cortex views">
    <button class="ui-btn" data-view="live" aria-pressed="true">Live cutaway</button>
    <button class="ui-btn" data-view="state" aria-pressed="false">State trace</button>
    <button class="ui-btn" data-view="evidence" aria-pressed="false">Evidence receipt</button>
  </nav>
  <div class="controls" aria-label="Trace controls">
    <button class="ui-btn" id="replay">Replay</button>
    <button class="ui-btn primary" id="pause" aria-pressed="false">Pause</button>
  </div>
</header>
<main class="workspace">
<section class="stage" aria-label="Interactive Cortex cutaway">
<svg class="plate view-live" id="plate" viewBox="0 0 1120 820" role="img" aria-labelledby="svg-title svg-desc" preserveAspectRatio="xMidYMid meet">
<title id="svg-title">Inside the Cerniam Cortex</title>
<desc id="svg-desc">A technical cutaway traces source events through domain hubs, graph context, semantic services, the Progressor, a state transition, decision candidates, immutable evidence, and a verified outcome return.</desc>

 <linearGradient id="cutGrad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#152b38"/><stop offset="1" stop-color="#09151f"/></linearGradient>
 <linearGradient id="chamberGrad" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#172d38"/><stop offset="1" stop-color="#09151f"/></linearGradient>
 <filter id="tealGlow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <filter id="whiteGlow"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
