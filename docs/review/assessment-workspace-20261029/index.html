.compact-list, .capability-list, .alert-list { display: grid; gap: 0; margin: 0; padding: 0; list-style: none; }

.agent-card dl, .agent-hero dl { display: grid; gap: var(--space-3); margin: 0; }.agent-card dl > div { display: grid; grid-template-columns: 6rem minmax(0, 1fr); gap: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--line); }
dt { color: var(--quiet); font-size: 0.64rem; text-transform: uppercase; } dd { min-width: 0; margin: 0; overflow-wrap: anywhere; font-size: 0.7rem; }
